name: Compilar app da TV

on:
  push:
    branches: [main]
    paths: ["app-tv/**", ".github/workflows/build-tv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: app-tv
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::Crie as variáveis FIREBASE_PROJECT_ID e FIREBASE_API_KEY em Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../reels-tv.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Reels TV (última versão)
          body: "Link direto para o Downloader: `https://github.com/${{ github.repository }}/releases/latest/download/reels-tv.apk`"
          files: reels-tv.apk
          make_latest: true
