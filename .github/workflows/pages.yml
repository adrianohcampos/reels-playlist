name: Publicar app do celular (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar config.js
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::Crie as variáveis FIREBASE_PROJECT_ID e FIREBASE_API_KEY em Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          printf 'export default { projectId: "%s", apiKey: "%s" };\n' "$FIREBASE_PROJECT_ID" "$FIREBASE_API_KEY" > pwa/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4
